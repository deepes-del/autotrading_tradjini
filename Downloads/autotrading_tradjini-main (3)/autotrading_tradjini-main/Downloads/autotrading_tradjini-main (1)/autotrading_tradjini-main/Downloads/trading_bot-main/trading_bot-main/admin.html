<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CubePlus Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#080b12;color:#e2e8f0;min-height:100vh}

    /* ── Nav ── */
    .topbar{background:#0d1117;border-bottom:1px solid #1e293b;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .topbar-brand{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#f43f5e,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .topbar-right{display:flex;align-items:center;gap:12px}
    #admin-badge{font-size:.8rem;color:#64748b}
    #logout-btn{display:none;padding:6px 14px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#e2e8f0;cursor:pointer;font-size:.85rem;transition:.2s}
    #logout-btn:hover{background:#334155}

    /* ── Layout ── */
    .container{max-width:1100px;margin:0 auto;padding:28px 20px}

    /* ── Login card ── */
    #login-section{max-width:380px;margin:80px auto 0}
    .card{background:#0d1117;border:1px solid #1e293b;border-radius:16px;padding:28px}
    .card h2{font-size:1rem;color:#64748b;margin-bottom:20px;font-weight:500}
    input{width:100%;padding:11px 14px;background:#080b12;border:1px solid #1e293b;color:#e2e8f0;border-radius:8px;font-size:.9rem;margin-bottom:14px;outline:none;transition:.2s}
    input:focus{border-color:#3b82f6}
    .btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem;color:#fff;transition:.2s;display:inline-flex;align-items:center;gap:6px}
    .btn:hover{opacity:.88;transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb)}
    .btn-success{background:linear-gradient(135deg,#10b981,#059669)}
    .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
    .btn-warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
    .btn-ghost{background:#1e293b;border:1px solid #334155}
    .btn-full{width:100%;justify-content:center;padding:12px}
    #login-msg{color:#f43f5e;font-size:.85rem;margin-top:8px;min-height:18px}

    /* ── Users table ── */
    #dashboard-section{display:none}
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .section-title{font-size:1.15rem;font-weight:600}
    .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
    .badge-pending{background:#2d1f00;color:#fbbf24}
    .badge-approved{background:#002d1f;color:#10b981}
    .badge-blocked{background:#2d0000;color:#ef4444}
    .badge-open{background:#002d1f;color:#10b981}
    .badge-closed{background:#1e293b;color:#94a3b8}

    table{width:100%;border-collapse:collapse}
    th,td{padding:13px 12px;text-align:left;font-size:.875rem;border-bottom:1px solid #1e293b}
    th{color:#64748b;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
    tr:hover td{background:rgba(255,255,255,.02)}
    .mono{font-family:monospace;font-size:.8rem;color:#94a3b8}
    .actions{display:flex;gap:6px;flex-wrap:wrap}

    /* ── User detail drawer ── */
    #detail-panel{display:none;margin-top:24px;border:1px solid #1e293b;border-radius:16px;overflow:hidden}
    .detail-header{background:#0d1117;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b}
    .detail-header h3{font-size:1rem;font-weight:600}
    .tabs{display:flex;gap:0;border-bottom:1px solid #1e293b;background:#0d1117}
    .tab-btn{padding:13px 22px;background:none;border:none;color:#64748b;cursor:pointer;font-size:.88rem;font-weight:500;border-bottom:2px solid transparent;transition:.15s}
    .tab-btn.active{color:#e2e8f0;border-bottom-color:#3b82f6}
    .tab-content{padding:20px 22px;background:#080b12;display:none;min-height:200px}
    .tab-content.active{display:block}

    /* Errors tab */
    .error-row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #0d1117}
    .error-row:last-child{border-bottom:none}
    .error-icon{font-size:1.1rem;flex-shrink:0;margin-top:2px}
    .error-type{font-size:.78rem;font-weight:700;letter-spacing:.04em}
    .error-msg{font-size:.85rem;color:#cbd5e1;margin-top:3px}
    .error-time{font-size:.75rem;color:#475569;margin-top:4px}
    .sev-error .error-type{color:#f43f5e}
    .sev-critical .error-type{color:#ff0050}
    .sev-warning .error-type{color:#f59e0b}
    .sev-info .error-type{color:#3b82f6}
    .raw-toggle{font-size:.72rem;color:#3b82f6;cursor:pointer;margin-top:4px;display:inline-block}
    .raw-pre{background:#0d1117;border:1px solid #1e293b;border-radius:6px;padding:10px;font-size:.72rem;font-family:monospace;white-space:pre-wrap;word-break:break-all;color:#94a3b8;margin-top:6px;display:none}

    /* Trades tab */
    .pnl-positive{color:#10b981;font-weight:600}
    .pnl-negative{color:#f43f5e;font-weight:600}

    /* Misc */
    .empty-state{text-align:center;padding:40px 0;color:#475569;font-size:.9rem}
    .empty-state span{font-size:2rem;display:block;margin-bottom:8px}
    .loading{text-align:center;padding:30px;color:#475569;font-size:.85rem}

    /* Toast */
    #toast{position:fixed;bottom:24px;right:24px;background:#1e293b;border-left:4px solid #3b82f6;color:#e2e8f0;padding:12px 18px;border-radius:10px;font-size:.88rem;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;max-width:320px}
    #toast.show{opacity:1}

    /* Refresh spinner */
    .spin{display:inline-block;animation:spin 1s linear infinite;font-size:.8rem}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-brand">⚡ CubePlus Admin</span>
  <div class="topbar-right">
    <span id="admin-badge"></span>
    <button id="logout-btn" onclick="adminLogout()">Logout</button>
  </div>
</div>

<div class="container">
  <!-- LOGIN -->
  <div id="login-section">
    <div class="card">
      <h2>Admin Login</h2>
      <input type="text" id="admin-username" placeholder="Username" onkeydown="if(event.key==='Enter')adminLogin()">
      <input type="password" id="admin-password" placeholder="Password" onkeydown="if(event.key==='Enter')adminLogin()">
      <button class="btn btn-primary btn-full" onclick="adminLogin()">Login</button>
      <div id="login-msg"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-section">
    <div class="section-header">
      <span class="section-title">Users Dashboard</span>
      <button class="btn btn-ghost" onclick="fetchUsers()"><span id="refresh-icon">↻</span> Refresh</button>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Bot Status</th>
            <th>Strategy</th>
            <th>Config</th>
            <th>Broker Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-table"><tr><td colspan="7" class="loading">Loading users…</td></tr></tbody>
      </table>
    </div>

    <!-- PER-USER DETAIL PANEL -->
    <div id="detail-panel">
      <div class="detail-header">
        <h3 id="detail-title">User Details</h3>
        <button class="btn btn-ghost" style="padding:5px 12px;font-size:.8rem" onclick="closeDetail()">✕ Close</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-errors-btn" onclick="switchTab('errors')">📛 Errors</button>
        <button class="tab-btn" id="tab-strategy-btn" onclick="switchTab('strategy')">📈 Strategy Signals</button>
        <button class="tab-btn" id="tab-broker-btn" onclick="switchTab('broker')">💰 Broker Trades (Real)</button>
      </div>
      <div id="tab-errors" class="tab-content active">
        <div id="errors-body" class="loading">Loading…</div>
      </div>
      <div id="tab-strategy" class="tab-content">
        <div id="strategy-body" class="loading">Loading…</div>
      </div>
      <div id="tab-broker" class="tab-content">
        <div id="broker-body" class="loading">Loading…</div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let adminToken = localStorage.getItem('admin_token');
let refreshInterval = null;
let activeDetailUser = null;
let activeTab = 'errors';

window.onload = () => {
  if (adminToken) showDashboard();
};

// ── Auth ──────────────────────────────────────────────────────
async function adminLogin() {
  const u = document.getElementById('admin-username').value.trim();
  const p = document.getElementById('admin-password').value;
  document.getElementById('login-msg').textContent = '';
  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await res.json();
    if (data.status === 'success') {
      adminToken = data.admin_token;
      localStorage.setItem('admin_token', adminToken);
      showDashboard();
    } else {
      document.getElementById('login-msg').textContent = data.error || 'Login failed';
    }
  } catch {
    document.getElementById('login-msg').textContent = 'Server connection error';
  }
}

function adminLogout() {
  localStorage.removeItem('admin_token');
  adminToken = null;
  clearInterval(refreshInterval);
  document.getElementById('login-section').style.display = 'block';
  document.getElementById('dashboard-section').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('admin-badge').textContent = '';
}

function showDashboard() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('dashboard-section').style.display = 'block';
  document.getElementById('logout-btn').style.display = 'inline-block';
  document.getElementById('admin-badge').textContent = adminToken.replace('admin_','') + ' (admin)';
  fetchUsers();
  refreshInterval = setInterval(fetchUsers, 8000);
}

// ── Users table ───────────────────────────────────────────────
async function fetchUsers() {
  const icon = document.getElementById('refresh-icon');
  icon.className = 'spin'; icon.textContent = '↻';
  try {
    const res = await fetch(`/admin/dashboard?admin_token=${adminToken}`);
    const data = await res.json();
    if (data.error === 'Unauthorized') { adminLogout(); return; }
    const tbody = document.getElementById('users-table');
    if (!data.users || !data.users.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><span>👤</span>No users yet</td></tr>';
      return;
    }
    tbody.innerHTML = data.users.map(u => {
      const approveBtn  = u.status === 'pending'  ? `<button class="btn btn-success" style="padding:5px 10px;font-size:.78rem" onclick="approveUser('${u.user_id}')">✅ Approve</button>` : '';
      const blockBtn    = u.status === 'approved' ? `<button class="btn btn-warn"    style="padding:5px 10px;font-size:.78rem" onclick="disapproveUser('${u.user_id}')">🚫 Block</button>` : '';
      const botBtn      = u.bot_running
        ? `<button class="btn btn-danger"  style="padding:5px 10px;font-size:.78rem" onclick="stopBot('${u.user_id}')">⏹ Stop</button>`
        : (u.status!=='blocked' ? `<button class="btn btn-primary" style="padding:5px 10px;font-size:.78rem" onclick="startBot('${u.user_id}')">▶ Start</button>` : '');
      const detailBtn   = `<button class="btn btn-ghost" style="padding:5px 10px;font-size:.78rem" onclick="openDetail('${u.user_id}','${u.name}')">🔍 View</button>`;
      const deleteBtn   = `<button class="btn btn-danger" style="padding:5px 10px;font-size:.78rem" onclick="deleteUser('${u.user_id}','${u.name}')">🗑</button>`;
      const botStatusStr = u.bot_running ? '🟢 Running' : '⚫ Idle';
      let stratName = '—';
      if (u.active_strategy) {
        if (u.active_strategy === 'strategy_one') stratName = 'Strat 1';
        else if (u.active_strategy === 'strategy_two') stratName = 'Strat 2';
        else if (u.active_strategy === 'strategy_three') stratName = 'Strat 3';
        else stratName = u.active_strategy;
      }
      const configStr = u.active_mode ? `${u.active_mode === 'custom' ? 'Custom' : 'Default'} (${u.active_sl}/${u.active_target})` : '—';
      const brokerStatus = u.broker_configured 
        ? `<span class="badge badge-approved">Configured</span>`
        : `<span class="badge badge-blocked">Not Set</span>`;
        
      return `<tr>
        <td class="mono">${u.user_id}</td>
        <td>${u.name}<br><small style="color:#64748b">${u.phone}</small></td>
        <td><span class="badge badge-${u.status}">${u.status.toUpperCase()}</span><br>${botStatusStr}</td>
        <td>${stratName}</td>
        <td><small>${configStr}</small></td>
        <td>${brokerStatus}</td>
        <td><div class="actions">${approveBtn}${blockBtn}${botBtn}${detailBtn}${deleteBtn}</div></td>
      </tr>`;
    }).join('');
  } catch { showToast('Failed to fetch users', '#ef4444'); }
  icon.className = ''; icon.textContent = '↻';
}

// ── User actions ──────────────────────────────────────────────
async function postAdmin(endpoint, body) {
  const res  = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({admin_token: adminToken, ...body})});
  return res.json();
}

async function approveUser(uid) {
  const d = await postAdmin('/admin/approve', {user_id: uid});
  showToast(d.status || d.error, d.error ? '#ef4444' : '#10b981');
  fetchUsers();
}

async function disapproveUser(uid) {
  if (!confirm(`Block user ${uid}? Their bot will stop immediately.`)) return;
  const d = await postAdmin('/admin/disapprove-user', {user_id: uid});
  showToast(d.status || d.error, d.error ? '#ef4444' : '#f59e0b');
  fetchUsers();
}

async function deleteUser(uid, name) {
  if (!confirm(`⚠️ PERMANENTLY DELETE "${name}" (${uid})? Cannot be undone.`)) return;
  const res  = await fetch('/admin/delete-user', {method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({admin_token: adminToken, user_id: uid})});
  const d    = await res.json();
  showToast(d.status || d.error, d.error ? '#ef4444' : '#10b981');
  if (activeDetailUser === uid) closeDetail();
  fetchUsers();
}

async function startBot(uid) {
  const d = await postAdmin('/admin/start-bot', {user_id: uid});
  showToast(d.status || d.error, d.error ? '#ef4444' : '#3b82f6');
  fetchUsers();
}

async function stopBot(uid) {
  const d = await postAdmin('/admin/stop-bot', {user_id: uid});
  showToast(d.status || d.info || d.error, d.error ? '#ef4444' : '#10b981');
  fetchUsers();
}

// ── Detail panel ──────────────────────────────────────────────
function openDetail(uid, name) {
  activeDetailUser = uid;
  document.getElementById('detail-title').textContent = `👤 ${name}  ·  ${uid}`;
  document.getElementById('detail-panel').style.display = 'block';
  document.getElementById('detail-panel').scrollIntoView({behavior:'smooth', block:'start'});
  switchTab(activeTab);
}

function closeDetail() {
  document.getElementById('detail-panel').style.display = 'none';
  activeDetailUser = null;
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-errors-btn').classList.toggle('active', tab === 'errors');
  document.getElementById('tab-strategy-btn').classList.toggle('active', tab === 'strategy');
  document.getElementById('tab-broker-btn').classList.toggle('active', tab === 'broker');
  
  document.getElementById('tab-errors').classList.toggle('active', tab === 'errors');
  document.getElementById('tab-strategy').classList.toggle('active', tab === 'strategy');
  document.getElementById('tab-broker').classList.toggle('active', tab === 'broker');
  
  if (!activeDetailUser) return;
  if (tab === 'errors') loadErrors(activeDetailUser);
  else if (tab === 'strategy') loadStrategyTrades(activeDetailUser);
  else if (tab === 'broker') loadBrokerTrades(activeDetailUser);
}

// ── Errors tab ────────────────────────────────────────────────
async function loadErrors(uid) {
  const body = document.getElementById('errors-body');
  body.innerHTML = '<div class="loading">Fetching errors…</div>';
  try {
    const res  = await fetch(`/admin/user-errors?admin_token=${adminToken}&user_id=${uid}&limit=100`);
    const data = await res.json();
    if (data.error) { body.innerHTML = `<div class="empty-state"><span>⚠️</span>${data.error}</div>`; return; }
    if (!data.errors || !data.errors.length) {
      body.innerHTML = '<div class="empty-state"><span>✅</span>No errors recorded for this user</div>'; return;
    }
    body.innerHTML = data.errors.map((e, i) => {
      const sev   = (e.severity || 'ERROR').toLowerCase();
      const icons = {critical:'🚨', error:'❌', warning:'⚠️', info:'ℹ️'};
      const icon  = icons[sev] || '❌';
      const ts    = new Date(e.created_at).toLocaleString('en-IN', {timeZone:'Asia/Kolkata', hour12:false});
      const rawId = `raw-${i}`;
      const rawHtml = e.raw_response
        ? `<span class="raw-toggle" onclick="toggleRaw('${rawId}')">show raw ▾</span>
           <pre class="raw-pre" id="${rawId}">${JSON.stringify(e.raw_response, null, 2)}</pre>`
        : '';
      return `<div class="error-row sev-${sev}">
        <div class="error-icon">${icon}</div>
        <div style="flex:1">
          <div class="error-type">${e.error_type}</div>
          <div class="error-msg">${e.error_message}</div>
          <div class="error-time">${ts} · ${e.severity || 'ERROR'}</div>
          ${rawHtml}
        </div>
      </div>`;
    }).join('');
  } catch { body.innerHTML = '<div class="empty-state"><span>🔴</span>Failed to load errors</div>'; }
}

function toggleRaw(id) {
  const el = document.getElementById(id);
  const show = el.style.display === 'block';
  el.style.display = show ? 'none' : 'block';
  el.previousElementSibling.textContent = show ? 'show raw ▾' : 'hide raw ▴';
}

// ── Strategy Trades tab ──────────────────────────────────────
async function loadStrategyTrades(uid) {
  const body = document.getElementById('strategy-body');
  body.innerHTML = '<div class="loading">Fetching strategy signals…</div>';
  try {
    const res  = await fetch(`/admin/strategy-trades?admin_token=${adminToken}&user_id=${uid}&limit=200`);
    const data = await res.json();
    if (data.error) { body.innerHTML = `<div class="empty-state"><span>⚠️</span>${data.error}</div>`; return; }
    if (!data.trades || !data.trades.length) {
      body.innerHTML = '<div class="empty-state"><span>📭</span>No strategy signals recorded yet</div>'; return;
    }
    const rows = data.trades.map(t => {
      const ts = new Date(t.created_at).toLocaleString('en-IN', {timeZone:'Asia/Kolkata', hour12:false});
      return `<tr>
        <td style="font-size:.78rem;color:#94a3b8">${ts}</td>
        <td style="font-weight:600">${t.symbol}</td>
        <td>${t.side}</td>
        <td>${t.qty}</td>
        <td>${t.entry_price}</td>
        <td>${t.sl}</td>
        <td>${t.target}</td>
      </tr>`;
    }).join('');
    body.innerHTML = `
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th>
            <th>Signal Entry</th><th>SL</th><th>Target</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch { body.innerHTML = '<div class="empty-state"><span>🔴</span>Failed to load strategy signals</div>'; }
}

// ── Broker Trades tab ────────────────────────────────────────
async function loadBrokerTrades(uid) {
  const body = document.getElementById('broker-body');
  body.innerHTML = '<div class="loading">Fetching real broker trades…</div>';
  try {
    const res  = await fetch(`/admin/broker-trades?admin_token=${adminToken}&user_id=${uid}&limit=200`);
    const data = await res.json();
    if (data.error) { body.innerHTML = `<div class="empty-state"><span>⚠️</span>${data.error}</div>`; return; }
    if (!data.trades || !data.trades.length) {
      body.innerHTML = '<div class="empty-state"><span>📭</span>No real broker trades executed yet</div>'; return;
    }
    const rows = data.trades.map(t => {
      const pnl     = t.exit_price ? ((t.exit_price - t.executed_price) * t.qty).toFixed(2) : '—';
      const pnlCls  = pnl === '—' ? '' : (parseFloat(pnl) >= 0 ? 'pnl-positive' : 'pnl-negative');
      const pnlStr  = pnl === '—' ? '—' : `${parseFloat(pnl) >= 0 ? '+' : ''}₹${pnl}`;
      const ts      = new Date(t.created_at).toLocaleString('en-IN', {timeZone:'Asia/Kolkata', hour12:false});
      
      return `<tr>
        <td style="font-size:.78rem;color:#94a3b8">${ts}</td>
        <td style="font-weight:600">${t.symbol}</td>
        <td>${t.qty}</td>
        <td>₹${t.executed_price}</td>
        <td>${t.sl ? '₹'+t.sl : '—'}</td>
        <td>${t.target ? '₹'+t.target : '—'}</td>
        <td>${t.exit_price ? '₹'+t.exit_price : '—'}</td>
        <td class="${pnlCls}">${pnlStr}</td>
        <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td>
      </tr>`;
    }).join('');
    body.innerHTML = `
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Time</th>
            <th>Option Symbol</th>
            <th>Qty</th>
            <th>Entry Premium</th>
            <th>SL Premium</th>
            <th>Target Premium</th>
            <th>Current/Exit Premium</th>
            <th>Premium P&amp;L</th>
            <th>Trade Status</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch { body.innerHTML = '<div class="empty-state"><span>🔴</span>Failed to load broker trades</div>'; }
}

// ── Toast ─────────────────────────────────────────────────────
let _tt;
function showToast(msg, color='#3b82f6') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.borderLeftColor = color;
  t.classList.add('show'); clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('show'), 3500);
}
