<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - CubePlus</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0d0f14;
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      background: linear-gradient(135deg, #f43f5e, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .card {
      background: #161b26;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: #0d0f14;
      border: 1px solid #1e293b;
      color: white;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background: #3b82f6;
    }

    .btn-success {
      background: #10b981;
    }

    .btn-danger {
      background: #ef4444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid #1e293b;
      font-size: 0.9rem;
    }

    th {
      color: #94a3b8;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-pending {
      color: #fbbf24;
      font-weight: 600;
    }

    .status-approved {
      color: #10b981;
      font-weight: 600;
    }

    .status-blocked {
      color: #ef4444;
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    .btn-warn {
      background: #f59e0b;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #e2e8f0;
      padding: 12px 20px;
      border-radius: 10px;
      border-left: 4px solid #3b82f6;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 999;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <h1>CubePlus Admin Panel</h1>

  <div id="login-section" class="card" style="max-width: 400px;">
    <h2 style="margin-top: 0; color: #94a3b8;">Admin Login</h2>
    <input type="text" id="admin-username" placeholder="Username">
    <input type="password" id="admin-password" placeholder="Password">
    <button class="btn-primary" style="width: 100%; padding: 12px;" onclick="adminLogin()">Login</button>
    <div id="login-msg" style="color: #ef4444; margin-top: 10px; font-size: 0.9rem;"></div>
  </div>

  <div id="dashboard-section" class="card hidden">
    <div
      style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px;">
      <h2 style="margin: 0;">Users Dashboard</h2>
      <button class="btn-primary" onclick="adminLogout()">Logout</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Bot Active</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-table">
        <!-- populated via js -->
      </tbody>
    </table>
  </div>

  <div id="toast"></div>

  <script>
    let adminToken = localStorage.getItem('admin_token');
    let refreshInterval = null;

    window.onload = () => {
      if (adminToken) showDashboard();
    };

    async function adminLogin() {
      const u = document.getElementById('admin-username').value;
      const p = document.getElementById('admin-password').value;
      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.status === 'success') {
          adminToken = data.admin_token;
          localStorage.setItem('admin_token', adminToken);
          showDashboard();
        } else {
          document.getElementById('login-msg').textContent = data.error || 'Login failed';
        }
      } catch (e) {
        document.getElementById('login-msg').textContent = 'Server connection error';
      }
    }

    function adminLogout() {
      localStorage.removeItem('admin_token');
      adminToken = null;
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
      if (refreshInterval) clearInterval(refreshInterval);
    }

    async function showDashboard() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      fetchUsers();
      refreshInterval = setInterval(fetchUsers, 5000);
    }

    async function fetchUsers() {
      if (!adminToken) return;
      try {
        const res = await fetch(`/admin/dashboard?admin_token=${adminToken}`);
        const data = await res.json();
        if (data.users) {
          const tbody = document.getElementById('users-table');
          tbody.innerHTML = data.users.map(u => {
            const isBlocked = u.status === 'blocked';
            const isPending = u.status === 'pending';
            const isApproved = u.status === 'approved';

            const approveBtn = isPending
              ? `<button class="btn-success btn-sm" onclick="approveUser('${u.user_id}')">✅ Approve</button>`
              : '';
            const disapproveBtn = isApproved
              ? `<button class="btn-warn btn-sm" onclick="disapproveUser('${u.user_id}')">🚫 Block</button>`
              : '';
            const botBtn = u.bot_running
              ? `<button class="btn-danger btn-sm" onclick="stopBot('${u.user_id}')">⏹ Stop Bot</button>`
              : (!isBlocked ? `<button class="btn-primary btn-sm" onclick="startBot('${u.user_id}')">▶ Start Bot</button>` : '');
            const deleteBtn = `<button class="btn-danger btn-sm" onclick="deleteUser('${u.user_id}', '${u.name}')">🗑 Delete</button>`;

            return `
              <tr>
                <td style="font-family: monospace; font-size:0.85rem;">${u.user_id}</td>
                <td>${u.name}</td>
                <td>${u.phone}</td>
                <td class="status-${u.status}">${u.status.toUpperCase()}</td>
                <td>${u.bot_running ? '🟢 Running' : '⚫ Idle'}</td>
                <td style="display: flex; gap: 6px; flex-wrap: wrap;">
                  ${approveBtn}${disapproveBtn}${botBtn}${deleteBtn}
                </td>
              </tr>`;
          }).join('');
        } else if (data.error === "Unauthorized") {
          adminLogout();
        }
      } catch (e) {
        console.error("Failed to fetch dashboard");
      }
    }

    async function approveUser(userId) {
      const res = await fetch('/admin/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_token: adminToken, user_id: userId })
      });
      const data = await res.json();
      showToast(data.status || data.error, data.error ? '#ef4444' : '#10b981');
      fetchUsers();
    }

    async function disapproveUser(userId) {
      if (!confirm(`Block user ${userId}?\nThis will stop their bot immediately and prevent re-login.`)) return;
      const res = await fetch('/admin/disapprove-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_token: adminToken, user_id: userId })
      });
      const data = await res.json();
      showToast(data.status || data.error, data.error ? '#ef4444' : '#f59e0b');
      fetchUsers();
    }

    async function deleteUser(userId, name) {
      if (!confirm(`⚠️ PERMANENTLY DELETE user "${name}" (${userId})?\nThis cannot be undone.`)) return;
      const res = await fetch('/admin/delete-user', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_token: adminToken, user_id: userId })
      });
      const data = await res.json();
      showToast(data.status || data.error, data.error ? '#ef4444' : '#10b981');
      fetchUsers();
    }

    async function startBot(userId) {
      const res = await fetch('/admin/start-bot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_token: adminToken, user_id: userId })
      });
      const data = await res.json();
      showToast(data.status || data.error, data.error ? '#ef4444' : '#3b82f6');
      fetchUsers();
    }

    async function stopBot(userId) {
      const res = await fetch('/admin/stop-bot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_token: adminToken, user_id: userId })
      });
      const data = await res.json();
      showToast(data.status || data.info || data.error, data.error ? '#ef4444' : '#10b981');
      fetchUsers();
    }

    let _toastTimer;
    function showToast(msg, color = '#3b82f6') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderLeftColor = color;
      t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>

</html>
